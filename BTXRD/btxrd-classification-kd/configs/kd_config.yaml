dataset:
  data_root: '../augmented_classification_data'
  image_size: 384
  num_classes: 9
  batch_size: 16
  num_workers: 4

teacher:
  model: 'efficientnet_b4'
  pretrained: true
  checkpoint: 'pretrained/teacher_best.pth'

student:
  model: 'convnext_tiny'
  pretrained: true

projection:
  teacher_dim: 1792
  student_dim: 768
  hidden_dim: 1024

kd_loss:
  temperature: 5.0
  alpha_kd: 0.5
  alpha_feature: 0.1
  alpha_ce: 0.4

label_smoothing: 0.1

training:
  phase1_epochs: 20
  phase2_epochs: 60
  phase1_lr: 0.001
  phase2_lr: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stopping_patience: 15

augmentation:
  train:
    random_resized_crop: true
    crop_scale: [0.8, 1.0]
    horizontal_flip: true
    vertical_flip: true
    rotation: 20
    color_jitter: [0.2, 0.2, 0.2, 0.1]
    cutmix_prob: 0.5
    mixup_prob: 0.5
    mixup_alpha: 0.2
  val:
    resize: 416
    center_crop: 384

optimizer:
  name: 'adamw'
  betas: [0.9, 0.999]
  eps: 1.0e-08

scheduler:
  name: 'cosine'
  min_lr: 1.0e-06

mixed_precision: true

seed: 42

output_dir: 'outputs/kd_student'
log_interval: 10
save_best_metric: 'weighted_f1'
